<span>CONTROL DE TEMPERATURA PADRE: {{this.temperature}}</span>

<app-control-temperature
  [temperature]="this.temperature"
  (temperatureOutput)="onCambioTemperatura($event)"
  (umbralOutput)="onCambioUmbral($event)">
</app-control-temperature>

<app-display-thermostate
  [temperature]="this.temperature"
  [umbral]="this.umbral"
  >
</app-display-thermostate>
